# Конфигурация развёртывания на Render.com (Infrastructure as Code).
# Render автоматически создаёт сервисы при подключении репозитория.

services:
  - type: web
    name: unitcode-hr
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    healthCheckPath: /healthz/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,unitcode-hr.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: unitcode-hr-db
          property: connectionString
      - key: CONNECTORS_MOCK_MODE
        value: "True"

databases:
  - name: unitcode-hr-db
    plan: free
    databaseName: unitcode_hr
    user: unitcode_hr_app
    postgresMajorVersion: 16
