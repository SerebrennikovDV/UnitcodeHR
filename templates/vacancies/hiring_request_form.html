{% extends 'base.html' %}
{% block content %}
<h1>Новая заявка на найм</h1>
<form method="post" class="row g-3">
    {% csrf_token %}
    {% for field in form %}
        <div class="col-md-6">
            <label class="form-label">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}
        </div>
    {% endfor %}
    <div class="col-12">
        <button class="btn btn-primary">Отправить на согласование</button>
    </div>
</form>
{% endblock %}
